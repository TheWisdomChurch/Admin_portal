name: CI (Admin Portal)

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

concurrency:
  group: admin-portal-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Placeholder values — this job never talks to a real backend;
          # it only needs the build to succeed.
          NEXT_PUBLIC_BACKEND_URL: https://example.invalid
          NEXT_PUBLIC_API_URL: https://example.invalid/api/v1
          APP_ADMIN_PORTAL_URL: https://example.invalid

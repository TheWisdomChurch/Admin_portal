services:
  nextjs-app:
    build:
      context: .
      target: development
    container_name: wisdomchurch-admin-dev
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      API_INTERNAL_URL: "http://wisdom_api:8080"
      NEXT_PUBLIC_API_URL: "https://api.wisdomchurchhq.org"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    profiles:
      - dev

  nextjs-app-prod:
    build:
      context: .
      target: production
    image: ghcr.io/thewisdomchurch/wisdom-admin:main
    container_name: wisdomchurch-admin-prod
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      API_INTERNAL_URL: "${API_INTERNAL_URL:-http://wisdom_api:8080}"
      ADMIN_PUBLIC_ORIGIN: "${ADMIN_PUBLIC_ORIGIN:-https://admin.wisdomchurchhq.org}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    profiles:
      - prod

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      nextjs-app-prod:
        condition: service_healthy
    profiles:
      - prod
